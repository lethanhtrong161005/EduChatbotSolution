[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "educhatai-ragas-service"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "instructor>=1.7,<2",
  "langchain>=0.3.27,<1",
  "langchain-community>=0.3.27,<0.4",
  "langchain-core>=0.3.80,<1",
  "langchain-openai>=0.3.35,<1",
  "litellm>=1.63,<2",
  "ragas==0.4.3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
