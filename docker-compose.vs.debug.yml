services:
  ragas:
    env_file: !reset []
    environment:
      GEMINI_API_KEY: !reset null
      OPENROUTER_API_KEY: !reset null
      RAGAS_LLM_OPTIONS: '[{"provider":"ollama","model":"qwen3","label":"Qwen 3 · Ollama"}]'
      RAGAS_EMBEDDING_OPTIONS: '[{"provider":"ollama","model":"bge-m3","label":"BGE-M3 · Ollama"}]'
      RAGAS_LOG_LEVEL: DEBUG

  web:
    env_file: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_HTTPS_PORTS: 8081
      HttpsRedirection__Enabled: true
    ports:
      - "8081:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
